<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 AI 레시피 전자책</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, school-publication; the book is the hero, the reader chrome stays quiet
   IDEA: an open book lying on a navy desk — pages turn sideways like a real 사례집
   PICTURE: the A4 pages themselves, large, as paper with a soft shadow; cover is drawn in the book's own navy
   COLOUR and TYPE: book navy #1F4E8C dominant, paper white, tint #EEF3FA support, orange #B4471A accent for the page marker; Noto Sans KR
   LAYOUT: thin top bar (title, 목차, counter) · page stage with scroll-snap · bottom bar with prev/next and slider */
:root{color-scheme:light dark;--desk:light-dark(#dfe6f0,#0d1a2c);--bar:light-dark(#ffffff,#13233a);--ink:light-dark(#14243a,#e8eef7);--mut:light-dark(#5b6b80,#9fb0c7);--navy:#1F4E8C;--tint:#EEF3FA;--acc:#B4471A;--line:light-dark(#d4dce8,#24384f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #5b9bff;outline-offset:2px}
header,footer{background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px max(2vw,12px);flex:none}
footer{border-bottom:0;border-top:1px solid var(--line)}
.brand{font-weight:900;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.brand small{font-weight:700}
@media(max-width:900px){.brand small{display:none}}
.brand b{color:var(--navy)}:root[data-theme=dark] .brand b{color:#8db6f0}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .brand b{color:#8db6f0}}
.sp{flex:1}
.btn{min-height:44px;min-width:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:transparent;display:inline-flex;align-items:center;gap:6px;font-size:15px}
.btn:hover{background:color-mix(in srgb,var(--navy) 10%,transparent)}
.btn[disabled]{opacity:.35;cursor:default}
.count{font-size:14px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--navy);height:44px}
#stage{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
#stage::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;gap:2px;padding:18px 12px}
.page{position:relative;aspect-ratio:1240/1754;height:min(100%,calc((100vw - 40px) * 1.4145));background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12),0 12px 34px rgba(10,30,60,.22);overflow:hidden;color:#14243a;container-type:size}
.spread .page:first-child{box-shadow:-1px 1px 2px rgba(0,0,0,.12),-10px 12px 30px rgba(10,30,60,.2),inset -14px 0 18px -14px rgba(0,0,0,.18)}
.spread .page:last-child{box-shadow:1px 1px 2px rgba(0,0,0,.12),10px 12px 30px rgba(10,30,60,.2),inset 14px 0 18px -14px rgba(0,0,0,.14)}
.page img{width:100%;height:100%;display:block;object-fit:contain}
.page a.hot{position:absolute;border-radius:3px;background:rgba(31,78,140,0);transition:background .2s}
.page a.hot:hover,.page a.hot:focus-visible{background:rgba(31,78,140,.14)}
/* cover */
.cover{background:var(--navy);color:#fff}
.page>.in{position:absolute;inset:0;display:flex;flex-direction:column}
.cover>.in{padding:9cqh 9cqw 7cqh}
.cover .top{white-space:nowrap;font-size:2.3cqh;font-weight:500;opacity:.8;border-top:.5cqh solid #fff;padding-top:1.6cqh}
.cover h1{white-space:nowrap;font-size:min(12cqh,17cqw);line-height:1;font-weight:900;margin:8cqh 0 2.4cqh;letter-spacing:-.03em}
.cover h1 span{display:block;font-size:4.2cqh;line-height:1.3;font-weight:500;letter-spacing:0;margin-bottom:3cqh;opacity:.85}
.cover .tag{white-space:nowrap;line-height:1.45;font-size:3.2cqh;font-weight:500;letter-spacing:.02em;opacity:1;padding-top:2.4cqh;border-top:1px solid rgba(255,255,255,.35);display:inline-block}
.cover p{font-size:2.6cqh;line-height:1.55;margin:0;opacity:.92;max-width:80%}
.cover .art{flex:1;position:relative;margin:4cqh 0}
.cover .art svg{position:absolute;inset:0;width:100%;height:100%}
.cover .bot{white-space:nowrap;font-size:2cqh;display:flex;justify-content:flex-end;align-items:baseline;opacity:.85}
.cover .bot .school{font-size:2.8cqh;font-weight:700;opacity:1}
/* toc */
.toc>.in{padding:8cqh 8cqw}
.toc .hd{border-top:.5cqh solid var(--navy);padding-top:1.6cqh;font-size:1.9cqh;color:#5b6b80;display:flex;justify-content:space-between}
.toc h2{font-size:4.6cqh;margin:3.5cqh 0 .6cqh;font-weight:900;letter-spacing:-.02em}
.toc .note{font-size:1.7cqh;color:#5b6b80;margin:0 0 2.4cqh}
.toc .gap{height:3cqh}
.toc section{margin-bottom:3.2cqh}
.toc h3{display:flex;align-items:baseline;gap:1.6cqw;font-size:2.5cqh;margin:0 0 .6cqh;padding:.9cqh 0;border-bottom:.3cqh solid var(--navy);color:var(--navy)}
.toc h3 b{font-size:2.5cqh;min-width:4cqw}
.toc h3 small,.toc h4 small{font-size:1.5cqh;font-weight:500;color:#5b6b80}
.toc h4{font-size:1.75cqh;margin:1cqh 0 .2cqh;color:#14243a}
.toc ol{list-style:none;margin:0;padding:0}
.toc li button,.toc li .row{all:unset;display:grid;grid-template-columns:5.5cqw 1fr auto;align-items:baseline;gap:1.4cqw;width:100%;padding:.9cqh 0;border-bottom:1px solid #e3e9f1}
.toc li button{cursor:pointer}
.toc li button:hover .t{color:var(--navy);text-decoration:underline}
.toc li button:focus-visible{outline:3px solid #5b9bff}
.toc .n{font-size:1.65cqh;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.toc .t{word-break:keep-all;font-size:1.65cqh;line-height:1.35;color:#14243a}
.toc .t em{font-style:normal;color:#5b6b80;font-size:1.45cqh}
.toc li button .t{font-weight:500}
.toc li.off .n{color:#8aa0bd}
.toc .pg{font-size:1.5cqh;color:var(--navy);font-weight:700;font-variant-numeric:tabular-nums}
#wrap{flex:1;position:relative;display:flex;min-height:0}
.side{position:absolute;top:50%;left:max(1vw,8px);transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:0;background:color-mix(in srgb,var(--bar) 88%,transparent);box-shadow:0 4px 16px rgba(10,30,60,.22);display:grid;place-items:center;cursor:pointer;z-index:3;transition:opacity .2s,transform .15s}
.side.r{left:auto;right:max(1vw,8px)}
.side svg{width:26px;height:26px;fill:none;stroke:var(--navy);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.side:hover{transform:translateY(-50%) scale(1.08)}
.side[disabled]{opacity:0;pointer-events:none}
@media(max-width:600px){.side{width:40px;height:40px;opacity:.85}.side svg{width:20px;height:20px}}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .side svg{stroke:#8db6f0}}
:root[data-theme=dark] .side svg{stroke:#8db6f0}
/* drawer */
#drawer{position:fixed;inset:0;background:rgba(8,18,32,.45);display:none;z-index:5}
#drawer.on{display:block}
#drawer .panel{position:absolute;top:0;left:0;bottom:0;width:min(360px,88vw);background:var(--bar);padding:18px;overflow:auto;box-shadow:8px 0 30px rgba(0,0,0,.25)}
#drawer h3{margin:4px 0 12px;font-size:18px}
#drawer li.ar{font-size:13px;font-weight:700;color:var(--mut);padding:14px 10px 4px}
#drawer ul{list-style:none;margin:0;padding:0}
#drawer li button{all:unset;cursor:pointer;display:block;width:100%;padding:12px 10px;border-radius:10px}
#drawer li button:hover,#drawer li button:focus-visible{background:color-mix(in srgb,var(--navy) 12%,transparent)}
#drawer li small{display:block;color:var(--mut);font-size:13px}
.sample{font-size:13px;color:var(--mut);white-space:nowrap}
@media(max-width:600px){.sample,.brand small{display:none}.btn .lbl{display:none}}
@media(prefers-reduced-motion:reduce){#stage{scroll-behavior:auto!important}}
</style>
</head>

    <circle cx="330" cy="210" r="34" fill="#B4471A"/><text x="330" y="217" text-anchor="middle" font-size="20" font-weight="900" fill="#fff" font-family="Noto Sans KR">AI</text>
  </svg></div>
  <div class="bot"><span class="school">인천디자인고등학교</span></div>
</div></div>`;

const TOC_SPLIT = [[[0,[0,1]]],[[1,[0,1]],[2,[0]]],[[3,[0]],[4,[0]]]];
const tocItem = ([no,t,tag]) => { const has = start[no] !== undefined;
  return `<li${has?'':' class="off"'}>${has?`<button data-go="${start[no]}">`:'<div class="row">'}<span class="n">${esc(no)}</span><span class="t">${esc(t)}${tag?` <em>${esc(tag)}</em>`:''}</span><span class="pg">${has?pno(start[no])+'쪽':''}</span>${has?'</button>':'</div>'}</li>`; };
const tocHTML = part => `<div class="page toc"><div class="in">
  <div class="hd"><span>2026 AI 레시피</span><span>목차 ${part+1}/3</span></div>
  ${part===0?'<h2>목차</h2><p class="note">제목을 누르면 해당 사례로 이동합니다.</p>':'<div class="gap"></div>'}
  ${TOC_SPLIT[part].map(([ai,gi,cont]) => { const [r,name,all] = TOC[ai]; const n = all.reduce((a,g)=>a+g[1].length,0); const groups = gi.map(k => all[k]);
    return `<section><h3><b>${r}</b>${esc(name)}<small>${cont?'(계속)':n}</small></h3>${groups.map(([g,items]) => `${g?`<h4>${esc(g)} <small>${items.length}</small></h4>`:''}<ol>${items.map(tocItem).join('')}</ol>`).join('')}</section>`; }).join('')}
</div></div>`;

const imgHTML = p => `<div class="page"><img src="${esc(p.img)}" alt="사례 ${esc(p.c.no)} ${esc(p.c.title)} ${p.i+1}쪽" loading="lazy">${
  p.links.map(([x,y,w,h,u]) => `<a class="hot" href="${esc(u)}" target="_blank" rel="noopener" style="left:${x-.6}%;top:${y-1}%;width:${w+1.2}%;height:${Math.max(h+2,3)}%" aria-label="링크 열기: ${esc(u)}"></a>`).join('')}</div>`;

const pageHTML = p => p.type==='cover' ? coverHTML() : p.type==='toc' ? tocHTML(p.part) : imgHTML(p);

const stage = document.getElementById('stage');
const slider = document.getElementById('slider');
const count = document.getElementById('count');
let slides = [];   // array of arrays of page indexes
let cur = 0;

function layout(){
  const wide = innerWidth >= 1000 && innerWidth / (innerHeight - 110) > 1.25;
  slides = [];
  if (wide){
    slides.push([0]);                       // cover alone, like a real book
    for (let i = 1; i < pages.length; i += 2) slides.push(pages[i+1] ? [i, i+1] : [i]);
  } else pages.forEach((_, i) => slides.push([i]));
  stage.innerHTML = slides.map(s => `<section class="slide${s.length>1?' spread':''}">${s.map(i => pageHTML(pages[i])).join('')}</section>`).join('');
  if (wide) stage.querySelectorAll('.spread .page').forEach(pg => pg.style.height = `min(100%, calc((50vw - 30px) * 1.4145))`);
  slider.max = slides.length - 1;
}

const slideOf = pi => slides.findIndex(s => s.includes(pi));
function go(si, smooth = true){
  si = Math.max(0, Math.min(slides.length - 1, si));
  const el = stage.children[si]; if (!el) return;
  stage.scrollTo({left: el.offsetLeft, behavior: smooth && Math.abs(si - cur) <= 1 && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'smooth' : 'auto'});
  setCur(si);
}
function placeSides(){
  const sl = stage.children[cur]; if (!sl) return;
  const pg = sl.querySelectorAll('.page'); if (!pg.length) return;
  const w = document.getElementById('wrap').getBoundingClientRect();
  const a = pg[0].getBoundingClientRect(), b = pg[pg.length-1].getBoundingClientRect();
  const bw = 52, gap = 14, L = a.left - w.left - stage.scrollLeft + sl.offsetLeft, R = b.right - w.left - stage.scrollLeft + sl.offsetLeft;
  const sp = document.getElementById('sPrev'), sn = document.getElementById('sNext');
  sp.style.left = Math.max(6, L - bw - gap) + 'px';
  sn.style.right = 'auto'; sn.style.left = Math.min(w.width - bw - 6, R + gap) + 'px';
}
addEventListener('resize', () => setTimeout(placeSides, 120));
function setCur(si){
  cur = si; slider.value = si;
  const s = slides[si], a = pno(s[0]), b = pno(s[s.length-1]);
  count.textContent = s[0] === 0 ? `표지 / ${pages.length-1}쪽` : `${a}${b!==a ? '–'+b : ''} / ${pages.length-1}쪽`;
  document.getElementById('prev').disabled = si === 0;
  document.getElementById('next').disabled = si === slides.length - 1;
  placeSides();
  document.getElementById('sPrev').disabled = si === 0;
  document.getElementById('sNext').disabled = si === slides.length - 1;
  try { history.replaceState(null, '', '#p' + s[0]); } catch(e) {}
}

let st;
stage.addEventListener('scroll', () => { clearTimeout(st); st = setTimeout(() => setCur(Math.round(stage.scrollLeft / stage.clientWidth)), 80); });
document.getElementById('prev').onclick = () => go(cur - 1);
document.getElementById('next').onclick = () => go(cur + 1);
document.getElementById('sPrev').onclick = () => go(cur - 1);
document.getElementById('sNext').onclick = () => go(cur + 1);
slider.oninput = () => go(+slider.value, false);
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
  if (e.key === 'Home') go(0); if (e.key === 'End') go(slides.length - 1);
  if (e.key === 'Escape') drawer.classList.remove('on');
});
stage.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(slideOf(+b.dataset.go)); });

// drawer TOC
const drawer = document.getElementById('drawer');
document.getElementById('dlist').innerHTML =
  `<li><button data-d="0">표지</button></li><li><button data-d="1">목차</button></li>` +
  TOC.map(([r,name,groups]) => `<li class="ar">${r}. ${esc(name)}</li>` + groups.flatMap(g=>g[1]).filter(([no]) => start[no] !== undefined)
    .map(([no,t]) => `<li><button data-d="${start[no]}">사례 ${esc(no)} · ${esc(t)}<small>${pno(start[no])}쪽</small></button></li>`).join('')).join('');
document.getElementById('menu').onclick = () => { drawer.classList.add('on'); drawer.querySelector('button').focus(); };
drawer.addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (b) go(slideOf(+b.dataset.d), false); if (b || e.target === drawer) drawer.classList.remove('on'); });

// start
let wideNow;
function rebuild(){ const keep = slides.length ? slides[cur][0] : (parseInt((location.hash.match(/^#p(\d+)$/)||[])[1]) || 0); layout(); go(slideOf(Math.min(keep, pages.length-1)), false); }
const ro = new ResizeObserver(() => { const w = innerWidth >= 1000 && innerWidth / (innerHeight - 110) > 1.25; if (w !== wideNow) { wideNow = w; rebuild(); } else go(cur, false); });
ro.observe(document.body);
addEventListener('hashchange', () => { const m = location.hash.match(/^#p(\d+)$/); if (m) go(slideOf(Math.min(+m[1], pages.length-1)), false); });
}
</script>
</body>
</html>
